<html lang="it">
<head>

  <title>La palestra matematica di Mate e Carl</title>
  <style>

    body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(8,18,40,.25),rgba(8,18,40,.72));z-index:-1}

    h1{font-size:clamp(2rem,9vw,3.6rem);line-height:.98;margin:5px 0 14px;text-shadow:0 4px 12px #000}.hero p{font-weight:800;font-size:1.05rem;margin:0 0 22px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#fde68a;font-size:.78rem}
    .btn{border:0;border-radius:18px;padding:14px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ef4f8f,#9b4de0);box-shadow:0 9px 20px rgba(91,33,182,.32);min-height:50px}.btn:active{transform:translateY(2px)}.btn.secondary{background:#fff;color:#233453;box-shadow:0 6px 15px rgba(15,23,42,.15)}.btn.ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);box-shadow:none}.btn.small{padding:9px 12px;min-height:40px;border-radius:13px;font-size:.88rem}.btn:disabled{opacity:.45;cursor:not-allowed}
    .topbar{width:min(100%,760px);display:flex;align-items:center;gap:10px;margin-bottom:14px}.topbar .title{flex:1;font-size:1.15rem;font-weight:1000;text-shadow:0 2px 8px #000}.round{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#172554;font-size:1.15rem;box-shadow:0 5px 16px rgba(0,0,0,.2)}
    .choice-title{text-align:center;text-shadow:0 3px 9px #000;margin:20px 0 16px}.characters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.char-card{padding:10px;overflow:hidden;text-align:center;border:2px solid transparent}.char-card img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 13%;border-radius:20px;display:block}.char-card h3{margin:8px 0 2px;font-size:1.35rem}.char-card p{margin:0 0 8px;font-size:.82rem}.char-card.selected{border-color:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.35),var(--shadow)}
    .module-grid{display:grid;gap:12px}.module{padding:18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}.module .ico{font-size:2.3rem}.module h3{margin:0 0 3px}.module p{margin:0;font-size:.88rem}.module.locked{opacity:.78;filter:saturate(.65)}.tag{position:absolute;right:10px;top:10px;border-radius:99px;background:#172554;color:#fff;padding:5px 9px;font-size:.66rem;font-weight:900;letter-spacing:.05em}
    .section-title{text-align:center;margin:5px 0 15px;text-shadow:0 2px 8px #000}.belt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.belt-card{position:relative;padding:15px;text-align:left;min-height:137px;overflow:hidden}.belt-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.22}.belt-card>*{position:relative}.belt-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.75);padding:6px 10px;border-radius:99px;font-weight:1000}.belt-dot{width:18px;height:8px;border-radius:2px;background:var(--belt);box-shadow:0 0 0 1px rgba(0,0,0,.18)}.belt-card h3{margin:10px 0 4px}.belt-card p{margin:0;font-size:.77rem;line-height:1.25}.belt-card.locked{filter:grayscale(.7);opacity:.6}.belt-card.done{box-shadow:0 0 0 3px #f6c646,var(--shadow)}
    .mentor{position:relative;width:94px;height:126px;flex:0 0 94px}.mentor img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;border-radius:18px}.css-belt{position:absolute;left:17%;right:17%;top:52%;height:8px;border-radius:2px;background:var(--belt);box-shadow:0 1px 2px #000}.css-belt:after{content:"";position:absolute;width:11px;height:11px;border-radius:3px;background:inherit;left:44%;top:-2px;transform:rotate(45deg);box-shadow:0 1px 2px #000}
    .level-head{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:12px}.level-head h2{margin:0 0 4px}.level-head p{margin:0;font-size:.84rem}.skills{padding:16px;margin-bottom:12px}.skills h3{margin:0 0 8px}.skills ul{padding-left:20px;margin:0}.skills li{margin:6px 0}.actions{display:grid;gap:10px}
    .quiz-card{padding:18px;margin-top:4px}.quiz-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.progress{height:9px;background:rgba(15,23,42,.16);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ef4f8f,#7c3aed);width:0}.timer{min-width:64px;text-align:center;background:#172554;color:#fff;padding:7px 9px;border-radius:12px;font-weight:1000}.timer.warn{background:#b91c1c;animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
    .question{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.72);border-radius:20px;padding:17px;margin:14px 0;font-size:1.15rem;font-weight:900;line-height:1.4}.options{display:grid;gap:9px}.option{border:2px solid rgba(37,55,85,.15);border-radius:15px;padding:13px;background:rgba(255,255,255,.82);color:var(--ink);font-weight:800;text-align:left}.option.selected{border-color:#7c3aed;background:#ede9fe}.option.correct{background:#dcfce7;border-color:#16a34a}.option.wrong{background:#fee2e2;border-color:#dc2626}.answer-input{width:100%;border:2px solid rgba(37,55,85,.2);background:rgba(255,255,255,.88);border-radius:16px;padding:14px;text-align:center;font-weight:1000;font-size:1.35rem;color:var(--ink)}
    .number-pool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num-tile{border:0;border-radius:16px;padding:16px 8px;background:#fff;color:#172554;font-size:1.5rem;font-weight:1000;box-shadow:0 5px 13px rgba(15,23,42,.14)}.num-tile.chosen{background:#fde68a;transform:scale(.96)}.num-tile.matched{background:#bbf7d0;color:#166534;opacity:.65}.pairs-log{min-height:30px;text-align:center;font-weight:900;color:#166534;margin-top:10px}.feedback{margin-top:12px;padding:13px;border-radius:15px;font-weight:800}.feedback.good{background:#dcfce7;color:#166534}.feedback.bad{background:#fee2e2;color:#991b1b}.quiz-actions{display:flex;gap:9px;margin-top:14px}.quiz-actions .btn{flex:1}
    .passport-head{padding:18px;text-align:center;margin-bottom:12px}.passport-head h2{margin:4px}.passport-list{display:grid;gap:9px}.pass-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px}.pass-row strong{display:block}.pass-row small{color:#52617a}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .modal{position:fixed;inset:0;background:rgba(3,7,18,.76);z-index:20;display:grid;place-items:center;padding:18px}.modal-card{width:min(100%,560px);max-height:86vh;overflow:auto;padding:20px}.modal-card h2{margin-top:0}.modal-card p,.modal-card li{line-height:1.48}.closex{float:right}
    .certificate{padding:24px;text-align:center;border:8px double var(--belt);background:rgba(255,255,255,.92);color:#172554}.certificate h2{font-size:2rem;margin:5px}.certificate .cert-belt{font-size:1.5rem;font-weight:1000;text-transform:uppercase;color:var(--bc)}.certificate .cert-img{width:150px;height:190px;object-fit:cover;object-position:50% 12%;border-radius:22px}.name-line{display:flex;align-items:center;gap:8px;margin:14px 0}.name-line input{flex:1;border:0;border-bottom:2px solid #334155;padding:8px;background:transparent}.tiny{font-size:.72rem;color:#64748b}
    footer{margin-top:auto;padding:20px 0 3px;text-align:center}.footer-link{border:0;background:none;color:#fff;text-decoration:underline;font-weight:800}
    @media(min-width:620px){.module-grid{grid-template-columns:1fr 1fr}.belt-grid{grid-template-columns:repeat(4,1fr)}.characters{gap:20px}.char-card{padding:15px}}
    @media print{body{background:#fff!important}.screen,.modal,.topbar,footer{display:none!important}#printArea{display:block!important;position:absolute;inset:0;background:#fff;padding:20px}.certificate,.print-pass{box-shadow:none!important;border-radius:0!important}.no-print{display:none!important}}
  </style>

<body>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="printArea" class="hidden"></div>
<input id="importFile" class="hidden" type="file" accept="application/json">
<script>
const BELTS=[
 {id:'white',name:'Bianca',color:'#f8fafc',c1:'#e2e8f0',c2:'#fff',skills:['Leggere, scrivere e rappresentare numeri naturali','Riconoscere il valore posizionale','Confrontare e ordinare numeri naturali','Collocare numeri sulla linea']},
 {id:'yellow',name:'Gialla',color:'#facc15',c1:'#fef08a',c2:'#f59e0b',skills:['Eseguire addizioni e sottrazioni','Usare strategie di calcolo mentale','Riconoscere gli amici del 10','Stimare e controllare un risultato']},
 {id:'orange',name:'Arancione',color:'#f97316',c1:'#fdba74',c2:'#ea580c',skills:['Eseguire moltiplicazioni e divisioni','Usare con sicurezza le tabelline','Distinguere divisione esatta e con resto','Riconoscere operazioni inverse']},
 {id:'green',name:'Verde',color:'#22c55e',c1:'#86efac',c2:'#15803d',skills:['Usare le proprietà delle operazioni','Rispettare la precedenza','Risolvere espressioni con numeri naturali','Stimare la plausibilità del risultato']},
 {id:'blue',name:'Blu',color:'#3b82f6',c1:'#93c5fd',c2:'#1d4ed8',skills:['Leggere e confrontare numeri decimali','Eseguire operazioni con i decimali','Moltiplicare e dividere per 10, 100, 1000','Arrotondare numeri decimali']},
 {id:'brown',name:'Marrone',color:'#92400e',c1:'#d6a56f',c2:'#78350f',skills:['Interpretare la frazione','Riconoscere frazioni equivalenti','Confrontare semplici frazioni','Calcolare la frazione di una quantità']},
 {id:'black',name:'Nera',color:'#111827',c1:'#64748b',c2:'#020617',skills:['Individuare multipli e divisori','Applicare criteri di divisibilità','Riconoscere numeri primi e composti','Comprendere e usare le potenze']},
 {id:'gold',name:'Oro',color:'#d4a017',c1:'#fde68a',c2:'#b45309',skills:['Scomporre in fattori primi','Calcolare MCD e mcm','Operare con semplici frazioni','Collegare frazioni, decimali e percentuali']}
];
const FRIENDS=[
 [7,4,3,6,8,2],[1,5,9,2,5,8],[6,3,4,7,1,9],[2,6,8,5,4,5],[9,4,1,7,6,3]
];
const FAST=[
 {n:[8,4,2,9,6],a:29,e:'(8+2)+(4+6)+9 = 10+10+9 = 29'},
 {n:[7,5,8,3,5],a:28,e:'(7+3)+(5+5)+8 = 10+10+8 = 28'},
 {n:[9,6,7,1,4],a:27,e:'(9+1)+(6+4)+7 = 10+10+7 = 27'},
 {n:[2,3,8,6,7],a:26,e:'(2+8)+(3+7)+6 = 10+10+6 = 26'},
 {n:[5,1,4,9,5],a:24,e:'(5+5)+(1+9)+4 = 10+10+4 = 24'}
];
const state={screen:'intro',character:localStorage.getItem('pm_character')||'',belt:0,mode:'',questions:[],q:0,score:0,answers:[],timer:null,time:30,pairPick:[],pairMatches:0,progress:loadProgress(),facilitated:localStorage.getItem('pm_facilitated')==='1'};
function loadProgress(){try{return JSON.parse(localStorage.getItem('pm_progress'))||{completed:[],attempts:{},updated:null}}catch{return{completed:[],attempts:{},updated:null}}}
function save(){state.progress.updated=new Date().toISOString();localStorage.setItem('pm_progress',JSON.stringify(state.progress));if(state.character)localStorage.setItem('pm_character',state.character)}
const $=s=>document.querySelector(s);const shuffle=a=>[...a].sort(()=>Math.random()-.5);const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const beltStyle=b=>`--belt:${b.color};--c1:${b.c1};--c2:${b.c2}`;
function shell(content,title='',back=''){return `<section class="screen"><div class="topbar">${back?`<button class="round" onclick="go('${back}')" aria-label="Indietro">←</button>`:''}<div class="title">${title}</div>${state.screen!=='intro'?`<button class="round" onclick="showPrivacy()" aria-label="Privacy">ⓘ</button>`:''}</div><div class="wrap">${content}</div><footer><button class="footer-link" onclick="showPrivacy()">Privacy e informazioni</button></footer></section>`}
function render(){clearTimer();const app=$('#app');if(state.screen==='intro')app.innerHTML=intro();if(state.screen==='choose')app.innerHTML=choose();if(state.screen==='home')app.innerHTML=home();if(state.screen==='belts')app.innerHTML=belts();if(state.screen==='level')app.innerHTML=level();if(state.screen==='quiz')app.innerHTML=quiz();if(state.screen==='passport')app.innerHTML=passport();if(state.screen==='certificate')app.innerHTML=certificate();}
function go(s){state.screen=s;render();scrollTo(0,0)}
function intro(){return shell(`<div class="hero"><div class="eyebrow">Una sfida alla volta</div><h1>La palestra matematica<br>di Mate e Carl</h1><p>Allenati, conquista le cinture, supera nuove sfide!</p><button class="btn" onclick="go('choose')">ENTRA NELLA PALESTRA</button></div>`)}
function choose(){return shell(`<h2 class="choice-title">Chi vuoi accanto nel tuo allenamento?</h2><div class="characters"><button class="char-card glass ${state.character==='mate'?'selected':''}" onclick="selectCharacter('mate')"><img src="mate.png" alt="Mate in kimono"><h3>Mate</h3><p>Curiosa, brillante e piena di energia</p></button><button class="char-card glass ${state.character==='carl'?'selected':''}" onclick="selectCharacter('carl')"><img src="carl.png" alt="Carl in kimono"><h3>Carl</h3><p>Creativo, coraggioso e tenace</p></button></div><button class="btn" style="width:100%;margin-top:14px" ${state.character?'':'disabled'} onclick="save();go('home')">COMINCIA L’ALLENAMENTO</button>`,'Scegli il tuo compagno','intro')}
function selectCharacter(c){state.character=c;save();render()}
function home(){return shell(`<div class="glass" style="padding:16px;margin-bottom:13px;display:flex;align-items:center;gap:12px"><div class="mentor"><img src="${state.character}.png" alt="${cap(state.character)}"><span class="css-belt" style="--belt:${currentBelt().color}"></span></div><div><div class="eyebrow" style="color:#7c3aed">Bentornato nella palestra</div><h2 style="margin:4px 0">Scegli il tuo ambiente</h2><p style="margin:0;font-size:.85rem">I progressi restano su questo dispositivo.</p></div></div><div class="module-grid"><button class="module glass" onclick="go('belts')"><span class="ico">🔢</span><div><h3>Numeri e calcolo</h3><p>Modulo completo · ${state.progress.completed.length}/8 cinture</p></div><span class="tag">DISPONIBILE</span></button>${[['📐','Geometria'],['📏','Grandezze e misure'],['🧩','Problemi e ragionamento']].map(x=>`<div class="module glass locked"><span class="ico">${x[0]}</span><div><h3>${x[1]}</h3><p>Ambiente già predisposto</p></div><span class="tag">PROSSIMAMENTE</span></div>`).join('')}</div><div class="tools"><button class="btn secondary small" onclick="go('passport')">Il mio passaporto</button><button class="btn secondary small" onclick="exportProgress()">Salva una copia</button><button class="btn secondary small" onclick="$('#importFile').click()">Ripristina</button><button class="btn secondary small" onclick="settings()">Impostazioni</button></div>`,'La palestra matematica')}
function belts(){return shell(`<h2 class="section-title">Le cinture di Numeri e calcolo</h2><div class="belt-grid">${BELTS.map((b,i)=>{const locked=i>0&&!state.progress.completed.includes(BELTS[i-1].id);const done=state.progress.completed.includes(b.id);return `<button class="belt-card glass ${locked?'locked':''} ${done?'done':''}" style="${beltStyle(b)}" ${locked?'disabled':''} onclick="openBelt(${i})"><span class="belt-chip"><i class="belt-dot"></i>${b.name}</span><h3>${done?'✓ Conquistata':locked?'🔒 Da sbloccare':'Pronta'}</h3><p>${b.skills[0]}</p></button>`}).join('')}</div>`,'Numeri e calcolo','home')}
function openBelt(i){state.belt=i;go('level')}
function level(){const b=BELTS[state.belt],done=state.progress.completed.includes(b.id);return shell(`<div class="level-head glass" style="${beltStyle(b)}"><div class="mentor"><img src="${state.character}.png" alt="${cap(state.character)}"><span class="css-belt"></span></div><div><div class="belt-chip"><i class="belt-dot"></i>Cintura ${b.name}</div><h2>${done?'Cintura conquistata!':'Preparati alla sfida'}</h2><p>Allenati senza fretta. Quando ti senti pronto, affronta il test.</p></div></div><div class="skills glass"><h3>Dimostrerò di saper…</h3><ul>${b.skills.map(s=>`<li>${s}</li>`).join('')}</ul></div><div class="actions"><button class="btn" onclick="startQuiz('training')">ALLENAMENTO</button><button class="btn secondary" onclick="startQuiz('test')">TEST DI PASSAGGIO</button>${done?`<button class="btn secondary" onclick="go('certificate')">CERTIFICATO</button>`:''}</div>`,'Cintura '+b.name,'belts')}
function startQuiz(mode){state.mode=mode;state.q=0;state.score=0;state.answers=[];state.questions=buildQuestions(state.belt,mode);state.screen='quiz';render()}
function mc(text,correct,wrong,explain){const options=[correct,...wrong].map(String).filter((v,i,a)=>a.indexOf(v)===i);return{type:'mc',text,correct:String(correct),options:shuffle(options),explain}}
function input(text,correct,explain){return{type:'input',text,correct:String(correct).replace('.',','),explain}}
function randomChoice(a){return a[ri(0,a.length-1)]}
function pick(a){return randomChoice(a)}
function yellowTest(){
 const pairSets=[[3,9,7,5,1,5],[2,4,8,6,9,1],[6,8,4,2,7,3]], fast=[{n:[6,8,4,7,2],a:27,e:'(6+4)+(8+2)+7 = 27'},{n:[9,5,1,3,5],a:23,e:'(9+1)+(5+5)+3 = 23'},{n:[7,4,3,8,6],a:28,e:'(7+3)+(4+6)+8 = 28'}];
 const ps=randomChoice(pairSets),f=randomChoice(fast),a=ri(210,690),target=Math.ceil((a+ri(250,650))/100)*100,subA=ri(600,950),subB=ri(120,490),roundA=ri(20,69)*100+ri(70,99),roundB=ri(10,39)*100+ri(1,30),invA=ri(420,890),invB=ri(120,390),invR=invA-invB,estA=ri(42,78)*100+ri(1,49),estB=ri(6,9)*100-1,estR=Math.round(estA/1000)*1000-Math.round(estB/1000)*1000;
 return [{type:'pairs',text:'Trova gli amici del 10',nums:ps,explain:'Hai formato tre coppie con somma 10.'},{type:'timedInput',text:`Calcolo mentale veloce: ${f.n.join(' + ')} = ?`,correct:String(f.a),explain:f.e},mc(`Calcola mentalmente: ${a} + ${target-a}`,target,[target-10,target+10,target-100],`${a}+${target-a}=${target}`),mc(`Calcola: ${subA} − ${subB}`,subA-subB,[subA-subB+10,subA-subB-10,subA-subB+100],`${subA}−${subB}=${subA-subB}`),mc(`Quale stima è più vicina a ${roundA} + ${roundB}?`,Math.round(roundA/1000)*1000+Math.round(roundB/1000)*1000,[Math.round((roundA+roundB)/1000)*1000-1000,Math.round((roundA+roundB)/1000)*1000+1000,Math.round((roundA+roundB)/500)*500+500],'Arrotonda gli addendi alle migliaia.'),input(`Completa: ${a} + ___ = ${target}`,target-a,`${target}−${a}=${target-a}`),mc(`Qual è l’operazione inversa di ${invA} − ${invB} = ${invR}?`,`${invR} + ${invB} = ${invA}`,[`${invA} + ${invB} = ${invR}`,`${invR} − ${invB} = ${invA}`,`${invB} − ${invR} = ${invA}`],'Addizione e sottrazione sono inverse.'),mc(`Senza eseguire il calcolo, ${estA} − ${estB} è circa…`,estR,[estR-1000,estR+1000,estR+2000],'Arrotonda i numeri alle migliaia prima di calcolare.')]

function certificate(){const b=BELTS[state.belt];return shell(`<div class="certificate glass" style="--belt:${b.color};--bc:${b.id==='black'?'#111827':b.color}"><div class="eyebrow" style="color:#7c3aed">La palestra matematica di Mate e Carl</div><h2>Certificato di cintura</h2><div class="cert-belt">Cintura ${b.name}</div><img class="cert-img" src="${state.character}.png" alt="${cap(state.character)}"><div class="name-line"><label for="certName">Conferito a</label><input id="certName" maxlength="40" placeholder="Scrivi il nome solo per la stampa"></div><p>Ha dimostrato di saper:</p><p><strong>${b.skills.join(' · ')}</strong></p><p>${new Date().toLocaleDateString('it-IT')}</p><p class="tiny">Il nome inserito nel certificato non viene memorizzato.</p><button class="btn no-print" onclick="printCertificate()">STAMPA O SALVA PDF</button></div>`,'Il tuo certificato','level')}
function printCertificate(){const src=document.querySelector('.certificate').cloneNode(true),name=$('#certName').value.trim();src.querySelector('.name-line').innerHTML=`<p style="font-size:1.3rem;width:100%;border-bottom:2px solid #334155;padding:8px"><strong>${escapeHtml(name)||'________________________'}</strong></p>`;src.querySelectorAll('.no-print').forEach(x=>x.remove());printNode(src)}
function printPassport(){const d=document.createElement('div');d.className='print-pass';d.innerHTML=`<div class="certificate"><h2>Il mio passaporto matematico</h2><p>Compagno di viaggio: ${cap(state.character)}</p>${BELTS.map(b=>`<p style="padding:10px;border-bottom:1px solid #ddd;text-align:left"><strong>Cintura ${b.name}</strong> — ${state.progress.completed.includes(b.id)?'raggiunta':'da raggiungere'}</p>`).join('')}<p class="tiny">Aggiornato il ${new Date().toLocaleDateString('it-IT')}</p></div>`;printNode(d)}
function printNode(n){const p=$('#printArea');p.innerHTML='';p.appendChild(n);p.classList.remove('hidden');setTimeout(()=>{print();p.classList.add('hidden')},120)}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'palestra-matematica',version:1,character:state.character,progress:state.progress},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='passaporto-matematico.json';a.click();URL.revokeObjectURL(a.href)}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='palestra-matematica'||!Array.isArray(d.progress?.completed))throw 0;state.progress=d.progress;state.character=d.character==='mate'?'mate':'carl';save();showModal('<h2>Percorso ripristinato</h2><p>Il passaporto è stato caricato correttamente.</p><button class="btn" onclick="closeModal();render()">CONTINUA</button>')}catch{showModal('<h2>File non riconosciuto</h2><p>Seleziona una copia esportata da questa app.</p><button class="btn" onclick="closeModal()">CHIUDI</button>')}};r.readAsText(f);e.target.value=''})
function settings(){showModal(`<button class="round closex" onclick="closeModal()">×</button><h2>Impostazioni</h2><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" ${state.facilitated?'checked':''} onchange="toggleTime(this.checked)"><span><strong>Tempo facilitato</strong><br><small>Porta da 30 a 60 secondi le sfide a tempo.</small></span></label><hr><button class="btn secondary" onclick="confirmReset()">Azzera tutti i progressi</button>`)}
function toggleTime(v){state.facilitated=v;localStorage.setItem('pm_facilitated',v?'1':'0')}
function confirmReset(){showModal(`<h2>Azzera i progressi?</h2><p>Le cinture conquistate su questo dispositivo verranno cancellate. Prima puoi salvare una copia dalla schermata principale.</p><div class="quiz-actions"><button class="btn secondary" onclick="closeModal()">ANNULLA</button><button class="btn" onclick="resetAll()">AZZERA</button></div>`)}function resetAll(){state.progress={completed:[],attempts:{},updated:null};save();closeModal();go('home')}
function showPrivacy(){showModal(`<button class="round closex" onclick="closeModal()">×</button><h2>Privacy e informazioni</h2><p><strong>Nessuna registrazione e nessun invio di dati.</strong> L’app conserva sul dispositivo, tramite la memoria locale del browser, soltanto il personaggio scelto, le cinture raggiunte, il numero dei tentativi e l’impostazione del timer.</p><p>I dati non vengono inviati all’autrice né condivisi con l’insegnante. Possono scomparire cancellando i dati del browser, utilizzando la navigazione privata o cambiando dispositivo. Le funzioni “Salva una copia” e “Ripristina” consentono di trasferire volontariamente il proprio percorso.</p><p>Il nome eventualmente inserito nel certificato è utilizzato soltanto per comporre la stampa e non viene memorizzato. Il riepilogo viene condiviso con l’insegnante solo su iniziativa dell’utente.</p><p>L’hosting può raccogliere i dati tecnici strettamente necessari alla distribuzione della pagina secondo le proprie condizioni. L’app non utilizza pubblicità, profilazione, cookie di marketing o strumenti di analisi.</p><p>Per domande: <a href="mailto:claudiabartoli77@libero.it">claudiabartoli77@libero.it</a></p><p class="tiny">Versione demo · Numeri e calcolo</p>`)}
function showModal(html){const m=$('#modal');m.innerHTML=`<div class="modal-card glass">${html}</div>`;m.classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function cap(x){return x?x[0].toUpperCase()+x.slice(1):''}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
render();
  </script>
</body>
</html>
